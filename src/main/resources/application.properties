spring.application.name=ulos
spring.datasource.url=jdbc:mysql://localhost:3306/ulos_enterprise?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Bangkok
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=12345
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.h2.console.enabled=false
flowable.database-schema-update=true
flowable.eventregistry.enabled=false
server.port=8080
app.security.jwt-secret=ulos-local-dev-jwt-secret-key-2026-please-change
app.security.jwt-expiration-seconds=36000

# Optional surrounding API endpoint for SLIK/Collateral request dispatch.
# Example: http://localhost:19090/api
los.precheck.surrounding.url=
