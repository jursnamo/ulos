spring.application.name=ulos
spring.datasource.url=jdbc:mysql://localhost:3306/ulos_enterprise?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Bangkok
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=12345
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Bangkok
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.h2.console.enabled=false
app.security.jwt-secret=ulos-enterprise-super-secret-key-that-should-be-changed
app.security.jwt-expiration-seconds=43200
flowable.database-schema-update=true
server.port=8080
